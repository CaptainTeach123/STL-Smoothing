name: site

# Tests the package and the browser app, then publishes docs/ to GitHub Pages (job "deploy").
# The "browser engine" job runs the REAL Python engine (Pyodide, downloaded from the jsDelivr CDN)
# in headless Chromium, which cannot be done offline.
#
# Publishing: Settings -> Pages -> Source must be "GitHub Actions". The site is the docs/ folder
# exactly as committed (no Jekyll: Jekyll drops every file whose name starts with an underscore,
# which is four of the engine's modules, and the engine could not load). It goes live only after
# every test job is green; a red run leaves the previous site in place.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      large:
        description: "Also run the large-model real-engine job (up to an hour)"
        type: boolean
        default: false

permissions:
  contents: read

# one run per branch at a time; a newer push waits instead of cancelling a deployment half-way
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -rs

  browser-ui:
    name: browser UI tests (stub engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STL_REQUIRE_BROWSER: "1"  # a missing browser or node fails these tests instead of skipping them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,webtest]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/test_web_ui.py tests/test_site.py -v -rs

  browser-engine:
    name: browser engine (real Pyodide)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,webtest]"
      - run: python -m playwright install --with-deps chromium
      - name: Real-engine end-to-end test
        env:
          E2E_OUT: e2e-out
        run: python tests/e2e_pyodide.py
      - name: Keep the screenshots, log and files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-out
          retention-days: 14

  # Publish docs/ as the GitHub Pages site, after the tests above have passed, for pushes to (and
  # manual runs on) the default branch, the only branch the github-pages environment lets deploy.
  deploy:
    name: publish to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [tests, browser-ui, browser-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5

  # Informational: how big a model the real engine can take in a browser tab. Runs when a manual run
  # ticks "large" or the commit message contains [large]; a failure here does not fail the workflow.
  browser-engine-large:
    name: browser engine, large models (informational)
    if: (github.event_name == 'workflow_dispatch' && inputs.large) || contains(github.event.head_commit.message, '[large]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,webtest]"
      - run: python -m playwright install --with-deps chromium
      - name: Real-engine test with 445k to 3.9M triangles
        env:
          E2E_OUT: e2e-large-out
          E2E_SIZES: "0.3,0.2,0.165,0.12,0.1"
          E2E_EXTRAS: "0"
        run: python tests/e2e_pyodide.py
      - name: Keep the log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-large-output
          path: |
            e2e-large-out/*.log
            e2e-large-out/*.png
          retention-days: 14
